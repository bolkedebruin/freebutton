name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for manual release'
        required: true
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The mquickjs engine is a pinned submodule; required to build.
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup UV
        uses: yezz123/setup-uv@v4

      - name: Create and activate virtual environment
        run: |
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-deps-${{ hashFiles('platformio.ini', 'web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install PlatformIO Core
        run: uv pip install --upgrade platformio setuptools

      # Fonts (media/fonts/*.ttf) and the mquickjs wasm assets are committed
      # real files, so release does NOT install fontTools, rebuild the fonts,
      # or run emcc.

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Sync firmware version
        # sync_version.py strips a leading 'v', writes VERSION, and propagates to
        # include/config.h (preserving the "FreeButton " prefix) + web/package.json.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python tools/scripts/sync_version.py "${VERSION}"
          python tools/scripts/sync_version.py --check

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web build
        working-directory: web
        run: npm run build

      - name: Build firmware
        # crt.S race mitigation: retry once on failure. See .wolf/buglog.json
        # bug-004 (esp_insights/esp_rainmaker crt.S ordering race).
        run: pio run -e esp32 || pio run -e esp32

      - name: Build LittleFS image (web IDE + config + fonts)
        run: pio run -e esp32 -t buildfs

      - name: Create firmware package
        run: |
          # Version as normalized by sync_version.py (leading 'v' stripped).
          VERSION="$(cat VERSION)"
          echo "package_version=${VERSION}" >> $GITHUB_ENV
          mkdir -p release
          cd .pio/build/esp32
          cp firmware.bin bootloader.bin partitions.bin littlefs.bin ../../../release/
          cd ../../../release
          # Ship firmware AND the LittleFS image (with the web IDE) together so a
          # single tag flashes a consistent device.
          tar -czf "freebutton_${VERSION}_firmware.tar.gz" \
            firmware.bin bootloader.bin partitions.bin littlefs.bin

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/freebutton_${{ env.package_version }}_firmware.tar.gz
          asset_name: freebutton_${{ env.package_version }}_firmware.tar.gz
          tag: ${{ github.event.release.tag_name }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freebutton-firmware-${{ env.package_version }}
          path: release/
          retention-days: 90
