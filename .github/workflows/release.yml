name: Build and Release

# Pushing a tag "v<version>" builds the firmware of that commit and creates
# the GitHub release with the firmware package. The tag must be the content of
# VERSION with a "v" in front (tools/scripts/sync_version.py sets VERSION):
#   git tag v3.1.0 && git push github v3.1.0
# A version with a suffix ("-alpha.1") becomes a pre-release.
# "Run workflow" builds the package of a branch without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The mquickjs engine is a pinned submodule; required to build.
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup UV
        uses: astral-sh/setup-uv@v10.4.0

      - name: Create and activate virtual environment
        run: |
          uv venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV   # absolute: CMake of ESP-IDF reads $VIRTUAL_ENV/pyvenv.cfg from another folder
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-deps-${{ hashFiles('platformio.ini', 'web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install PlatformIO Core
        run: uv pip install --upgrade platformio setuptools

      # Fonts (media/fonts/*.ttf, unmodified upstream files) and the mquickjs
      # wasm assets are committed real files, so release does NOT build fonts
      # or run emcc.

      - name: Check the tag against VERSION
        # The release is built from the tagged commit as it is: the tag has to
        # name the version that commit carries.
        run: |
          python tools/scripts/sync_version.py --check
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$(cat VERSION)" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ($(cat VERSION)); expected v$(cat VERSION)"
            exit 1
          fi

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web build
        working-directory: web
        run: npm run build

      - name: Build firmware
        # crt.S race mitigation: retry once on failure. See .wolf/buglog.json
        # bug-004 (esp_insights/esp_rainmaker crt.S ordering race).
        run: pio run -e esp32 || pio run -e esp32

      - name: Keep the firmware files
        # The next step (buildfs) can reconfigure the ESP-IDF build, which
        # empties the build folder: copy what the firmware build made first.
        run: |
          mkdir -p release
          cp .pio/build/esp32/firmware.bin .pio/build/esp32/firmware.elf \
             .pio/build/esp32/bootloader.bin .pio/build/esp32/partitions.bin release/

      - name: Build LittleFS image (web IDE + config + examples)
        run: |
          pio run -e esp32 -t buildfs
          cp .pio/build/esp32/littlefs.bin release/

      - name: Create firmware package
        run: |
          VERSION="$(cat VERSION)"
          echo "package_version=${VERSION}" >> $GITHUB_ENV
          cd release
          # Flash offsets of partition table v2 (tools/partition_tables/button_v2.csv).
          # firmware.elf is for reading core dumps (docs/MIGRATION-PARTITIONS-V2.md).
          printf '%s\n' \
            'Partition table v2 (16 MB). esptool.py --chip esp32s3 write_flash:' \
            '0x0      bootloader.bin' '0x8000   partitions.bin' '0x10000  firmware.bin' \
            '0xB60000 littlefs.bin' \
            'A v1 device needs a full erase first: docs/MIGRATION-PARTITIONS-V2.md' > FLASHING.txt
          # TODO: once tools/scripts/flash_media.py exists, add the media partition
          # image (0x660000, fonts) to the package.
          # Ship firmware AND the LittleFS image (with the web IDE) together so a
          # single tag flashes a consistent device.
          tar -czf "freebutton_${VERSION}_firmware.tar.gz" \
            firmware.bin firmware.elf bootloader.bin partitions.bin littlefs.bin FLASHING.txt

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${package_version}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            "release/freebutton_${package_version}_firmware.tar.gz" \
            --title "FreeButton ${package_version}" \
            --generate-notes --verify-tag ${PRERELEASE}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: freebutton-firmware-${{ env.package_version }}
          path: release/
          retention-days: 90
