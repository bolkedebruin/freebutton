name: FreeButton CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup UV
        uses: yezz123/setup-uv@v4

      - name: Create and activate virtual environment
        run: |
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('platformio.ini', 'package*.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install PlatformIO Core
        run: uv pip install --upgrade platformio setuptools

      - name: Install lv_font_conv
        run: npm install -g lv_font_conv

      - name: Install jq (for font processing)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate fonts
        run: |
          cd tools/fonts
          chmod +x generatefonts.sh
          ./generatefonts.sh

      - name: Build firmware (ESP32)
        run: pio run -e esp32

      - name: Build tests (Native)
        run: pio run -e native

      - name: Run tests
        run: pio test -e native

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/esp32/firmware.bin
            .pio/build/esp32/bootloader.bin
            .pio/build/esp32/partitions.bin
          retention-days: 30