name: FreeButton CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The mquickjs engine is a pinned submodule; without this the
          # firmware and the web IDE cannot build at all.
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup UV
        uses: yezz123/setup-uv@v4

      - name: Create and activate virtual environment
        run: |
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-deps-${{ hashFiles('platformio.ini', 'web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install PlatformIO Core
        run: uv pip install --upgrade platformio setuptools

      # Fonts are committed (media/fonts/*.ttf, unmodified upstream files) and the mquickjs
      # wasm assets in web/public/assets are committed real files, so CI does NOT build
      # fonts or run emcc.

      - name: Check web IDE wasm compiler matches the firmware stdlib
        # Bytecode refers to stdlib ROM atoms by offset: a stale committed
        # wasm compiles scripts that misbehave on this firmware (bug-036).
        run: python3 tools/js/wasm_stdlib_fingerprint.py --check

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web build
        # prebuild regenerates stdlib.json / freebutton.d.ts / autocomplete-data.ts
        # from the engine before vite build.
        working-directory: web
        run: npm run build

      - name: Check generated web artifacts are in sync with engine
        # Fails CI if the committed generated files drift from what the current
        # engine produces (engine <-> web drift).
        run: git diff --exit-code -- web/src/js/stdlib.json web/src/js/freebutton.d.ts web/src/js/autocomplete-data.ts

      - name: Web test
        working-directory: web
        run: npm run test

      - name: Build firmware (ESP32)
        # crt.S race mitigation: full-clean builds intermittently fail with
        # "Source .../rmaker_*.crt.S not found" (esp_insights/esp_rainmaker embed
        # certs via transitive framework deps even though disabled; not removable
        # via our config). See .wolf/buglog.json bug-004. Retry once on failure.
        run: pio run -e esp32 || pio run -e esp32

      - name: Build LittleFS image (web IDE + config + examples)
        run: pio run -e esp32 -t buildfs

      - name: Check images against the partition table
        # tools/partition_tables/button_v2.csv: firmware.bin must fit app0 (PlatformIO
        # checks this too), littlefs.bin must be exactly the `data` partition.
        run: |
          python3 - <<'PY'
          import csv, os, sys
          parts = {}
          with open("tools/partition_tables/button_v2.csv") as f:
              for row in csv.reader(l for l in f if not l.lstrip().startswith("#")):
                  if len(row) >= 5 and row[0].strip():
                      parts[row[0].strip()] = int(row[4].strip(), 0)
          fw = os.path.getsize(".pio/build/esp32/firmware.bin")
          fs = os.path.getsize(".pio/build/esp32/littlefs.bin")
          print(f"firmware.bin {fw} of app0 {parts['app0']} ({parts['app0'] - fw} free)")
          print(f"littlefs.bin {fs}, data partition {parts['data']}")
          if fw > parts["app0"] or fs != parts["data"]:
              sys.exit("image does not match the partition table")
          PY

      # TODO: once tools/scripts/flash_media.py exists, build the media partition
      # image from media/<bucket>/<key> here (no device: image only) and add it
      # (media.bin) to the artefacts below.

      - name: Build native (compile check)
        # Compile-only sanity check. test/ has no Unity suites, so `pio test`
        # is intentionally NOT run here (it would fail with no tests).
        run: pio run -e native

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/esp32/firmware.bin
            .pio/build/esp32/firmware.elf
            .pio/build/esp32/bootloader.bin
            .pio/build/esp32/partitions.bin
            .pio/build/esp32/littlefs.bin
          retention-days: 30
