; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32
; buildfs/uploadfs package this staging dir (assembled by assemble_littlefs.py)
; instead of data/ directly, so gzipped www/ + config + examples land in the image
; (fonts are in the media partition, not LittleFS: tools/scripts/media_sync.py).
data_dir = .pio/staging_data

[env]
; Every library is pinned to an exact version: a caret range resolves to the
; newest release on a fresh checkout and has broken the build (FastLED).
lib_deps =
	https://github.com/joltwallet/esp_littlefs#v1.20.4
	adafruit/Adafruit BusIO @ 1.17.4
	adafruit/Adafruit MCP23017 Arduino Library @ 2.3.2
	adafruit/Adafruit Unified Sensor @ 1.1.15
	adafruit/Adafruit BME280 Library @ 2.3.0
	bblanchon/ArduinoJson @ 7.4.3
	lvgl/lvgl @ 9.6.0
	fastled/FastLED @ 3.10.3
	ESP32Async/ESPAsyncWebServer @ 3.12.1
	ESP32Async/AsyncTCP @ 3.5.0  ; pinned: otherwise resolved transitively (^) to whatever is newest
	https://github.com/bolkedebruin/rapidjson.git#14c42a6eb1b3685be8fa494700fb57db01712a1d
	https://github.com/lovyan03/LovyanGFX.git#dd228d15a03900ce658fd62e120dc7cc489915dd  ; 1.3.0
lib_ignore =
	RPAsyncTCP
	ESPAsyncTCP

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
;platform_packages =
;	tool-cmake @ ~4.2.0
extra_component_dirs = components
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = tools/partition_tables/button_v2.csv
board_build.flash_mode = qio
board_build.filesystem = littlefs
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_dtr = 0
;monitor_raw = yes
monitor_filters = esp32_exception_decoder
framework = arduino, espidf
extra_scripts =
    pre:tools/scripts/pre_build_js_stdlib.py
    pre:tools/scripts/build_info_flags.py
    pre:tools/scripts/assemble_littlefs.py
    pre:tools/scripts/render_build.py
build_flags =
	${env.build_flags}
	; AsyncTCP defaults its "async_tcp" task stack to 16 KB (bytes on ESP-IDF),
	; allocated from internal heap at server begin. Measured worst case on hardware
	; (parallel /config + /api/device + 240 KB gz asset) is ~3.2 KB, so 8 KB keeps
	; ~5 KB headroom and returns ~8.5 KB of internal heap.
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
	-std=gnu++23
	-Os
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D LV_CONF_PATH='"src/lv_conf.h"'
	-I lib/mquickjs
	-I src/scripting/generated
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS=${PROJECT_DIR}/sdkconfig.defaults
	-DIDF_COMPONENT_MANAGER=1
; NOTE: do NOT add -DSDKCONFIG here. The pioarduino espidf builder already sets
; -DSDKCONFIG=<project>/sdkconfig.esp32 (the committed per-env config). Overriding
; it with ${PROJECT_BUILD_DIR}/sdkconfig failed to expand (PROJECT_BUILD_DIR is not
; a SCons var), dumped a stray root ./sdkconfig, and produced the recurring
; "sdkconfig is defined as an output multiple times" ninja error.
; embed_txtfiles pre-materializes the esp_insights/esp_rainmaker cert .crt.S files so
; SCons never races ninja on a clean build (buglog bug-004). These components are hard-
; required by the Arduino-ESP32 framework and cannot be dropped via EXCLUDE_COMPONENTS.
board_build.embed_txtfiles =
	managed_components/espressif__esp_insights/server_certs/https_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:native]
platform = native
test_framework = unity
extra_scripts =
	pre:tools/scripts/sanitize_cpath.py
lib_deps =
	bblanchon/ArduinoJson @ 7.4.3
	https://github.com/bolkedebruin/rapidjson.git#14c42a6eb1b3685be8fa494700fb57db01712a1d
build_flags =
	-D FREEBUTTON_TEST
	-D LV_CONF_SKIP
	-D UNITY_INCLUDE_CONFIG_H
	-std=gnu++23
test_build_src = yes
build_src_filter = +<test/*> -<*>
lib_ignore =
	lvgl
	LovyanGFX
	FastLED
	Adafruit BusIO
	Adafruit MCP23017 Arduino Library
	Adafruit Unified Sensor
	Adafruit BME280 Library
	ESPAsyncWebServer
