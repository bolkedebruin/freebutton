[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_deps =
#	https://github.com/joltwallet/esp_littlefs
	adafruit/Adafruit BusIO @ 1.16 ; 1.17 is not working
	adafruit/Adafruit MCP23008 library @ 2.1.0
	adafruit/Adafruit Unified Sensor @ ^1.1.6
	adafruit/Adafruit BME280 Library
	bblanchon/ArduinoJson @ ^7.0.0
	#lvgl/lvgl @ ^9.3.0
	fastled/FastLED @ ^3.7.7
	ESP32Async/ESPAsyncWebServer
	https://github.com/bolkedebruin/rapidjson.git#master
lib_ignore =
	RPAsyncTCP
	ESPAsyncTCP
extra_component_dirs = components

[env:esp32]
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = tools/partition_tables/button_v1.csv
board_build.filesystem = littlefs
board = esp32-s3-devkitc-1

monitor_speed = 115200
monitor_dtr = 0
monitor_raw = yes

framework = arduino, espidf
build_flags =
	${env.build_flags}
	-D USE_HSPI_PORT
	-D ESP32_DMA
	-D HW=9
	-D LV_COLOR_16_SWAP
	-D FREEBUTTON_ONDEMAND_KERN
	-std=gnu++23
	-Os
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

board_build.cmake_extra_args = 
    -DSDKCONFIG_DEFAULTS=${PROJECT_DIR}/sdkconfig.defaults
    -DSDKCONFIG=${PROJECT_BUILD_DIR}/sdkconfig
	-DIDF_COMPONENT_MANAGER=1

board_build.embed_txtfiles =
	managed_components/espressif__esp_insights/server_certs/https_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt


[env:native]
platform = native
test_framework = unity
lib_deps =
	${env.lib_deps}
build_flags =
	${env.build_flags}
	-D BUTTON_TEST
	-D LV_CONF_SKIP
	-D UNITY_INCLUDE_CONFIG_H
	-std=gnu++23

