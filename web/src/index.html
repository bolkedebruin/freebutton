<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeButton JavaScript Editor</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FreeButton JavaScript Editor</h1>
            <div class="subtitle">Compile JavaScript to bytecode in your browser</div>
        </header>

        <div class="main-content">
            <div id="loadingIndicator" class="loading">
                <div class="spinner"></div>
                <p>Loading compiler...</p>
            </div>

            <div id="editorSection" class="editor-section" style="display: none;">
                <div class="toolbar">
                    <button id="compileBtn">Compile</button>
                    <button id="validateBtn" class="secondary">Validate</button>
                    <button id="downloadBtn" class="success" disabled>Download .jsc</button>
                    <button id="clearBtn" class="secondary">Clear</button>
                </div>

                <div class="examples">
                    <h3>Load Example:</h3>
                    <div class="example-buttons">
                        <button id="exampleBlink" class="secondary">LED Blink</button>
                        <button id="exampleSensor" class="secondary">Sensor Reading</button>
                        <button id="exampleButton" class="secondary">Button Handler</button>
                        <button id="exampleMqtt" class="secondary">MQTT Publish</button>
                    </div>
                </div>

                <div class="editor-container">
                    <div id="codeEditor"></div>
                    <div class="cursor-position" id="cursorPosition">Ln 1, Col 1</div>
                </div>

                <div id="status" class="status"></div>

                <div id="bytecodeInfo" class="bytecode-info">
                    <h3>Bytecode Information</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Size</div>
                            <div class="info-value"><span id="bytecodeSize">0</span> bytes</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Magic</div>
                            <div class="info-value" id="bytecodeMagic">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Version</div>
                            <div class="info-value" id="bytecodeVersion">-</div>
                        </div>
                    </div>
                    <div id="hexPreview" class="hex-preview"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="bundle.js"></script>
</body>
</html>
