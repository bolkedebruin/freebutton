<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeButton IDE</title>
  <!-- Fonts are self-hosted from /fonts/ (see @font-face in src/app.css) so the
       IDE has zero external dependencies when served offline from the device. -->
  <style>body { opacity: 0; } body.ready { opacity: 1; }</style>
</head>
<body>
  <fb-app></fb-app>
  <script type="module" src="/src/main.ts"></script>
  <script>customElements.whenDefined('fb-app').then(() => document.body.classList.add('ready'));</script>
</body>
</html>
